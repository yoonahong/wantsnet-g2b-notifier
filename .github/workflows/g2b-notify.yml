name: g2b notify

on:
  schedule:
    - cron: 45 2 * * *
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send-notice:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: install deps
        run: pip install requests

      - name: run script
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
        run: python 나라장터_공고.py

      - name: commit sent_bids.json
        run: |
          if [ -n "$(git status --porcelain sent_bids.json)" ]; then
            git config user.name github-actions[bot]
            git config user.email github-actions[bot]@users.noreply.github.com
            git add sent_bids.json
            git commit -m "update sent bids"
            git push
          else
            echo no changes
          fi
