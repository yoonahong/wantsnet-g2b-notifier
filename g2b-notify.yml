name: 나라장터 공고 알림 메일 발송

on:
  schedule:
    # 매일 한국시간(KST) 오전 9:30 = UTC 00:30
    - cron: "30 0 * * *"
  workflow_dispatch: {}   # 필요할 때 수동 실행 버튼도 사용 가능

permissions:
  contents: write   # sent_bids.json 변경사항을 저장소에 커밋하기 위해 필요

jobs:
  send-notice:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존 패키지 설치
        run: pip install requests

      - name: 스크립트 실행 (공고 조회 및 메일 발송)
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
        run: python 나라장터_공고.py

      - name: 발송 이력(sent_bids.json) 저장소에 반영
        run: |
          if [ -n "$(git status --porcelain sent_bids.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sent_bids.json
            git commit -m "chore: 발송 이력 업데이트 [skip ci]"
            git push
          else
            echo "변경된 발송 이력 없음"
          fi
